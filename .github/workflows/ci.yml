name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: ruff check src tests scripts examples
      - run: ruff format --check src tests scripts examples
      - run: mypy
      - name: Feature reference is up to date
        run: |
          python scripts/gen_feature_docs.py
          git diff --exit-code docs/features.md

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: pytest --cov --cov-report=term-missing

  minimum-versions:
    name: oldest supported dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install "numpy==1.23.5" "cadquery-ocp==7.9.3.1.1" pytest plotly
      - run: python -m pip install -e . --no-deps
      - run: pytest -q

  extras:
    name: framework adapters
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e ".[dev,pyg]"
      - run: pytest -q tests/test_api.py tests/test_v02.py -k "pyg or dgl or missing_extra"

  package:
    name: install built wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - name: Install the wheel in a clean environment and use it
        shell: bash
        run: |
          python -m venv clean
          BIN=clean/bin; [ -d clean/Scripts ] && BIN=clean/Scripts
          $BIN/python -m pip install dist/*.whl pytest
          $BIN/python -c "import brepgraph; print(brepgraph.__version__)"
          $BIN/brepgraph --version
          $BIN/python -m pytest -q tests/test_api.py -k "cli"
